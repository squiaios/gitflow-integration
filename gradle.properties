pluginGroup = squiaios
pluginName = GitFlow Pilot
pluginVersion = 1.0.1

# Minimum IDE build supported (262 = 2026.2). No upper bound is declared.
pluginSinceBuild = 262

# IDE the plugin is built and run against. PS = PhpStorm.
platformType = PS
platformVersion = 2026.2.3

# Optional: build against a locally installed IDE instead of downloading one, e.g.
#   -PlocalIdePath=$HOME/.local/share/JetBrains/Toolbox/apps/phpstorm
# localIdePath =

# The 2026.2 platform ships Java 25 bytecode, so the plugin targets Java 25.
javaVersion = 25

# The IDE bundles the Kotlin standard library: the plugin must not ship its own copy.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
